{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Edit Ride Request</title>
{% endblock %}

{% block content %}
    <h2>Edit Ride Request</h2>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="row mb-3">
                    <div class="col-md-10">
                        <label>Start Latitude</label>
                        <input type="number" step="0.000001" class="form-control" id="start_latitude" name="start_latitude" value="{{ req.CurrentLocation.Latitude }}" required>
                        <label>Start Longitude</label>
                        <input type="number" step="0.000001" class="form-control" id="start_longitude" name="start_longitude" value="{{ req.CurrentLocation.Longitude }}" required>
                    </div>
                    <div class="col-md-2 mt-4">
                        <br/>
                        <button type="button" id="setStartBtn" class="btn btn-outline-primary mt-2">Set Start</button>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-10">
                        <label>End Latitude</label>
                        <input type="number" step="0.000001" class="form-control" id="end_latitude" name="end_latitude" value="{{ req.TargetLocation.Latitude }}" required>
                        <label>End Longitude</label>
                        <input type="number" step="0.000001" class="form-control" id="end_longitude" name="end_longitude" value="{{ req.TargetLocation.Longitude }}" required>
                    </div>
                    <div class="col-md-2 mt-4">
                        <br/>
                        <button type="button" id="setEndBtn" class="btn btn-outline-primary mt-2">Set End</button>
                    </div>
                </div class="mb-3">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Target Start Time</label>
                            <input type="datetime-local" class="form-control" name="target_start_time" value="{{ req.targetTime.StartTime }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Target End Time</label>
                            <input type="datetime-local" class="form-control" name="target_end_time" value="{{ req.targetTime.EndTime }}">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Pickup Start Time</label>
                            <input type="datetime-local" class="form-control" name="pickup_start_time" value="{{ req.pickupTime.StartTime }}">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Pickup End Time</label>
                            <input type="datetime-local" class="form-control" name="pickup_end_time" value="{{ req.pickupTime.EndTime }}">
                        </div>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="needRamp" {% if req.needRamp %}checked{% endif %}>
                    <label class="form-check-label">Need Ramp</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-3">
                    <label>Requested Adults</label>
                    <input type="number" name="requestedAdults" value="{{ req.requestedAdults }}" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Requested Childs</label>
                    <input type="number" name="requestedChilds" value="{{ req.requestedChilds }}" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Luggage</label>
                    <input type="number" name="luggage" value="{{ req.luggage }}" class="form-control">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="allowCarpooling" {% if req.personalPreferences.allowCarpooling %}checked{% endif %}>
                    <label class="form-check-label">Allow Carpooling</label>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Tolerated Delay Before (min)</label>
                            <input type="number" name="toleratedDelayBefore" value="{{ req.personalPreferences.toleratedDelayBefore }}" class="form-control">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label>Tolerated Delay After (min)</label>
                            <input type="number" name="toleratedDelayAfter" value="{{ req.personalPreferences.toleratedDelayAfter }}" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label>Simulated Time</label>
                    <input type="datetime-local" name="SimulatedTime" value="{{ req.SimulatedTime }}" class="form-control">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="bookProposal" {% if req.bookProposal %}checked{% endif %}>
                    <label class="form-check-label">Book Proposal</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="createReport" {% if req.createReport %}checked{% endif %}>
                    <label class="form-check-label">Create Report</label>
                </div>
            </div>
        </div>

        <div id="map" style="height: 400px;" class="mb-3"></div>

        <button type="submit" class="btn btn-success">Änderungen speichern</button>
        <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        initDualPointEntityMap({
            mapId: "map",
            overlay: {{ map_overlay_data|tojson }},
            mode: "edit",
            primaryType: "ride",
            editable: true,
            startLatInputId: "start_latitude",
            startLngInputId: "start_longitude",
            endLatInputId: "end_latitude",
            endLngInputId: "end_longitude",
            startButtonId: "setStartBtn",
            endButtonId: "setEndBtn",
            startLat: {{ req.CurrentLocation.Latitude }},
            startLng: {{ req.CurrentLocation.Longitude }},
            endLat: {{ req.TargetLocation.Latitude }},
            endLng: {{ req.TargetLocation.Longitude }},
            lineColor: "#CB2B3E"
        });
    });
    </script>
{% endblock %}
