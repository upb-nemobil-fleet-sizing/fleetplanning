{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Create Cab</title>
{% endblock %}

{% block content %}
    <h2>Create Cab</h2>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label>Label</label>
                <input type="text" name="label" class="form-control">
            </div>
            <div class="mb-3">
                <label>License Plate</label>
                <input type="text" name="licensePlate" class="form-control">
            </div>

            <div class="mb-3">
                <label>Latitude</label>
                <input type="number" step="0.000001" id="latitude" name="latitude" class="form-control">
            </div>
            <div class="mb-3">
                <label>Longitude</label>
                <input type="number" step="0.000001" id="longitude" name="longitude" class="form-control">
            </div>

            <div class="mb-3">
                <label>Schedule Start</label>
                <input type="datetime-local" name="schedule_start" class="form-control">
            </div>
            <div class="mb-3">
                <label>Schedule End</label>
                <input type="datetime-local" name="schedule_end" class="form-control">
            </div>

            <div class="mb-3">
                <label>Seats</label>
                <input type="number" name="seats" value="4" class="form-control">
            </div>
            <div class="mb-3">
                <label>Child Seats</label>
                <input type="number" name="childSeats" value="0" class="form-control">
            </div>
            <div class="mb-3">
                <label>Luggage Capacity</label>
                <input type="number" name="luggage" value="0" class="form-control">
            </div>
            <div class="mb-3">
                <label>Operating Company</label>
                <input type="text" name="operatingCompany" class="form-control">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="hasRamp" id="hasRamp">
                <label class="form-check-label" for="hasRamp">Has Ramp</label>
            </div>
        </div>

        <div class="col-md-6">
            <div class="accordion mb-3" id="accordionCabCreate">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingPower">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                        Power Consumption
                    </button>
                    </h2>
                    <div id="flush-collapseOne" class="accordion-collapse collapse" aria-labelledby="headingPower" data-bs-parent="#accordionCabCreate">
                        <div class="accordion-body">
                            <div class="mb-3"><label>Speed</label><input type="number" step="0.01" name="pc_speed" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Wind</label><input type="number" step="0.01" name="pc_wind" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Load Capacity</label><input type="number" step="0.01" name="pc_loadCapacity" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Tire Traction</label><input type="number" step="0.01" name="pc_tireTraction" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Weather Conditions</label><input type="number" step="0.01" name="pc_weatherConditions" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Climatronic</label><input type="number" step="0.01" name="pc_climatronic" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Regenerative Braking</label><input type="number" step="0.01" name="pc_regenerativeBraking" value="0" class="form-control"></div>
                        </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                        Weitere Daten
                    </button>
                    </h2>
                    <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionCabCreate">
                        <div class="accordion-body">
                            <div class="mb-3"><label>Flatrat Energy Consumption</label><input type="number" step="0.01" name="FlatratEnergyConsumption" value="0.01" class="form-control"></div>
                            <div class="mb-3"><label>Risk</label><input type="number" step="0.01" name="Risk" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Total Energy Capacity</label><input type="number" name="TotalEnergyCapacity" value="10000" class="form-control"></div>
                            <div class="mb-3"><label>Initial Energy Capacity</label><input type="number" name="InitialEnergyCapacity" value="10000" class="form-control"></div>
                            <div class="mb-3"><label>Max Speed</label><input type="number" step="1" name="maxSpeed" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Max Speed Autonomous</label><input type="number" step="1" name="maxSpeedAutonomous" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Regenerative Power</label><input type="number" step="0.01" name="regenerativePower" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Maximum Regenerative Power</label><input type="number" step="0.01" name="maxiumRegenerativePower" value="0" class="form-control"></div>
                            <div class="mb-3"><label>Default Energy Consumption per m</label><input type="number" step="0.01" name="defaultEnergyConsuptionPerM" value="0.1" class="form-control"></div>
                            <div class="mb-3"><label>Vehicle Type</label><input type="text" name="vehicleType" value="cab" class="form-control"></div>
                            <div class="mb-3"><label>State of Schedule</label><input type="text" name="stateOfSchedule" value="Planned" class="form-control"></div>
                            <div class="mb-3"><label>Charging Curve</label><input type="number" step="0.01" name="chargingCurve" value="0" class="form-control"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <h5>Position wählen</h5>
            <div id="map" style="height:400px; border:1px solid #ccc;"></div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Speichern</button>
                <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
            </div>
        </div>
        </div>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            initSinglePointEntityMap({
                mapId: "map",
                overlay: {{ map_overlay_data|tojson }},
                mode: "create",
                primaryType: "cab",
                editable: true,
                latInputId: "latitude",
                lngInputId: "longitude"
            });
        });
    </script>
{% endblock %}
