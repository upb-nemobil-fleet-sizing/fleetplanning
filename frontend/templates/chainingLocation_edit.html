{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Edit Chaining Location</title>
{% endblock %}

{% block content %}
    <h2>Edit Chaining Location</h2>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="Guid">Guid</label>
                        <input type="text" class="form-control" id="Guid" name="Guid" value="{{ loc.Guid }}">
                    </div>
                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-10">
                                <label for="start_latitude">Start Latitude</label>
                                <input type="number" step="0.000001" class="form-control me-2" id="start_latitude" name="start_latitude" value="{{ loc.LocationStart.Latitude }}" required>
                                <label for="start_longitude">Start Longitude</label>
                                <input type="number" step="0.000001" class="form-control me-2" id="start_longitude" name="start_longitude" value="{{ loc.LocationStart.Longitude }}" required>
                            </div>
                            <div class="col-md-2 mt-2">
                                <br/>
                                <br/>
                                <button type="button" id="setStartBtn" class="btn btn-outline-primary">Set Start</button>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                    <label for="AdditionalTime">Additional Time</label>
                    <input type="number" class="form-control" id="AdditionalTime" name="AdditionalTime" value="{{ loc.AdditionalTime }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label>Type</label>
                        <select name="Type" class="form-select">
                            <option value="Chain" {% if loc.Type == "Chain" %}selected{% endif %}>Chain</option>
                            <option value="Unchain" {% if loc.Type == "Unchain" %}selected{% endif %}>Unchain</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <div class="row">
                            <div class="col-md-10">
                                <label for="end_latitude">End Latitude</label>
                                <input type="number" step="0.000001" class="form-control me-2" id="end_latitude" name="end_latitude" value="{{ loc.LocationEnd.Latitude }}" required>
                                <label for="end_longitude">End Longitude</label>
                                <input type="number" step="0.000001" class="form-control me-2" id="end_longitude" name="end_longitude" value="{{ loc.LocationEnd.Longitude }}" required>
                            </div>
                            <div class="col-md-2 mt-2">
                                <br/>
                                <br/>
                                <button type="button" id="setEndBtn" class="btn btn-outline-primary">Set End</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <div id="map" style="height: 400px;" class="mb-3"></div>

        <button type="submit" class="btn btn-success">Speichern</button>
        <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
    </form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    initDualPointEntityMap({
        mapId: "map",
        overlay: {{ map_overlay_data|tojson }},
        mode: "edit",
        primaryType: "chaining",
        primaryId: "{{ loc.id }}",
        editable: true,
        startLatInputId: "start_latitude",
        startLngInputId: "start_longitude",
        endLatInputId: "end_latitude",
        endLngInputId: "end_longitude",
        startButtonId: "setStartBtn",
        endButtonId: "setEndBtn",
        startLat: {{ loc.LocationStart.Latitude }},
        startLng: {{ loc.LocationStart.Longitude }},
        endLat: {{ loc.LocationEnd.Latitude }},
        endLng: {{ loc.LocationEnd.Longitude }},
        lineColor: "#9C2BCB"
    });
});
</script>
{% endblock %}
