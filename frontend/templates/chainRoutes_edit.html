{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Edit Chain Route</title>
{% endblock %}

{% block content %}
    <h2>Edit Chain Route</h2>
    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Guid</label>
                    <input type="text" name="Guid" class="form-control" value="{{ route.Guid }}">
                </div>
                <div class="mb-3">
                    <label>Start Location</label>
                    <select name="StartLocation" id="startLocation" class="form-select" required>
                        {% for loc in chaining_locations %}
                          <option value="{{ loc.id }}" {% if route.StartLocation == loc.id %}selected{% endif %}>
                              {{ loc.id }} ({{ loc.LocationStart.Latitude }}, {{ loc.LocationStart.Longitude }})
                          </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label>End Location</label>
                    <select name="EndLocation" id="endLocation" class="form-select" required>
                        {% for loc in chaining_locations %}
                          <option value="{{ loc.id }}" {% if route.EndLocation == loc.id %}selected{% endif %}>
                              {{ loc.id }} ({{ loc.LocationEnd.Latitude }}, {{ loc.LocationEnd.Longitude }})
                          </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Duration (min)</label>
                    <input type="number" step="0.1" name="Duration" class="form-control" value="{{ route.Duration }}">
                </div>
                <div class="mb-3">
                    <label>Distance (km)</label>
                    <input type="number" step="0.1" name="Distance" class="form-control" value="{{ route.Distance }}">
                </div>
            </div>
        </div>
        <div id="map" style="height:400px; border:1px solid #ccc;" class="mb-3"></div>
        <button type="submit" class="btn btn-success">Speichern</button>
        <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
    </form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    initChainRouteMap({
        mapId: "map",
        overlay: {{ map_overlay_data|tojson }},
        mode: "edit",
        primaryType: "route",
        startSelectId: "startLocation",
        endSelectId: "endLocation"
    });
});
</script>
{% endblock %}
