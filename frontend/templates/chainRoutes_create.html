{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Create Chain Route</title>
{% endblock %}

{% block content %}
    <h2>Create Chain Route</h2>
    <form method="POST" id="chainRouteForm">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Guid</label>
                    <input type="text" name="Guid" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Start Location</label>
                    <select name="StartLocation" id="startLocation" class="form-select" required>
                        <option value="" disabled selected>Bitte auswählen</option>
                        {% for loc in chaining_locations %}
                          <option value="{{ loc.id }}">{{ loc.id }} ({{ loc.LocationStart.Latitude }}, {{ loc.LocationStart.Longitude }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label>Intermediate Chaining Locations</label>
                    <div id="intermediateList" class="list-group">
                        {% for loc in chaining_locations %}
                        <label class="list-group-item d-flex justify-content-between align-items-center intermediate-item" data-id="{{ loc.id }}">
                            <span>{{ loc.id }}</span>
                            <input type="checkbox" value="{{ loc.id }}" class="form-check-input me-1 intermediate-checkbox">
                        </label>
                        {% endfor %}
                    </div>
                    <input type="hidden" name="IntermediateChainingLocations" id="intermediateHidden">
                </div>

                <div class="mb-3">
                    <label>End Location</label>
                    <select name="EndLocation" id="endLocation" class="form-select" required>
                        <option value="" disabled selected>Bitte auswählen</option>
                        {% for loc in chaining_locations %}
                          <option value="{{ loc.id }}">{{ loc.id }} ({{ loc.LocationEnd.Latitude }}, {{ loc.LocationEnd.Longitude }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-3">
                    <label>Duration (min)</label>
                    <input type="number" step="0.1" name="Duration" value="0" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Distance (km)</label>
                    <input type="number" step="0.1" name="Distance" value="0" class="form-control">
                </div>
            </div>
        </div>
        <div id="map" style="height:400px; border:1px solid #ccc;" class="mb-3"></div>
        <button type="submit" class="btn btn-success">Speichern</button>
        <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
    </form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    initChainRouteMap({
        mapId: "map",
        overlay: {{ map_overlay_data|tojson }},
        mode: "create",
        primaryType: "route",
        startSelectId: "startLocation",
        endSelectId: "endLocation"
    });

    const startSelect = document.getElementById("startLocation");
    const endSelect = document.getElementById("endLocation");
    const intermediateItems = document.querySelectorAll(".intermediate-item");
    const hiddenInput = document.getElementById("intermediateHidden");
    const form = document.getElementById("chainRouteForm");

    function updateIntermediateVisibility() {
        const startId = startSelect.value;
        const endId = endSelect.value;
        intermediateItems.forEach(item => {
            const id = item.dataset.id;
            if (id === startId || id === endId) {
                item.style.display = "none";
                item.querySelector(".intermediate-checkbox").checked = false;
            } else {
                item.style.display = "flex";
            }
        });
    }

    function updateHiddenInput() {
        const selected = Array.from(document.querySelectorAll(".intermediate-checkbox:checked"))
                              .map(cb => cb.value);
        hiddenInput.value = JSON.stringify(selected);
    }

    startSelect.addEventListener("change", updateIntermediateVisibility);
    endSelect.addEventListener("change", updateIntermediateVisibility);
    document.querySelectorAll(".intermediate-checkbox").forEach(cb => {
        cb.addEventListener("change", updateHiddenInput);
    });

    form.addEventListener("submit", () => {
        updateHiddenInput(); // ensure hidden input is updated before submit
    });
});
</script>
{% endblock %}
