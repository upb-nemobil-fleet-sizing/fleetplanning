{% extends "base.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Create Charging Point</title>
{% endblock %}

{% block content %}
    <h2>Create Charging Point</h2>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label>Latitude</label>
                    <input type="number" step="0.000001" id="latitude" name="latitude" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Longitude</label>
                    <input type="number" step="0.000001" id="longitude" name="longitude" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Type</label>
                    <input type="text" name="type" value="Electric" class="form-control">
                </div>
                <div class="mb-3">
                    <label>State</label>
                    <select name="state" class="form-select">
                        <option value="Free">Free</option>
                        <option value="Occupied">Occupied</option>
                        <option value="OutOfOrder">Out of Order</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Maximum Stopping Time (s)</label>
                    <input type="number" name="MaximumStoppingTime" value="3600" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Owner</label>
                    <input type="text" name="owner" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Maximum Power Supply (kW)</label>
                    <input type="number" step="0.1" name="maximumPowerSupply" value="0" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Maximum Regenerative Power (kW)</label>
                    <input type="number" step="0.1" name="MaximumRegenerativePower" value="0" class="form-control">
                </div>
            </div>
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Opening Hours</h5>
                    </div>
                        <div class="mb-3">
                            <label>WeekDays</label>
                            <input type="text" name="WeekDays" value="All" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Opening Hour Min</label>
                            <input type="time" name="OpeningHourMin" value="05:00" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>Opening Hour Max</label>
                            <input type="time" name="OpeningHourMax" value="23:00" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label>Operators</label>
                    <input type="text" name="operators" placeholder="(optional)" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Voltage (V)</label>
                    <input type="number" step="0.1" name="voltage" value="0" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Amperage (A)</label>
                    <input type="number" step="0.1" name="amperage" value="0" class="form-control">
                </div>
            </div>
        </div>

        <!-- Map -->
        <h5>Position wählen</h5>
        <div id="map" style="height:400px; border:1px solid #ccc;" class="mb-3"></div>

        <button type="submit" class="btn btn-success">Speichern</button>
        <a href="{{ url_for('index') }}{{ nav_context_query or '' }}" class="btn btn-secondary">Abbrechen</a>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='vendor/leaflet-1.9.4/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='js/form_maps.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            initSinglePointEntityMap({
                mapId: "map",
                overlay: {{ map_overlay_data|tojson }},
                mode: "create",
                primaryType: "charging",
                editable: true,
                latInputId: "latitude",
                lngInputId: "longitude"
            });
        });
    </script>
{% endblock %}
